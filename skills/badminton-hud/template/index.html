<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"p1","type":"string","label":"Player 1 (near, left)","default":"Player 1"},
  {"id":"p2","type":"string","label":"Player 2 (near, right)","default":"Player 2"},
  {"id":"p3","type":"string","label":"Player 3 (far, left)","default":"Player 3"},
  {"id":"p4","type":"string","label":"Player 4 (far, right)","default":"Player 4"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="tracks.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Rajdhani", "Inter", sans-serif; color: #e8fbff; }
      :root { --a: #3b8bff; --b: #ff3b4e; --s: #d6ff3a; --glass: rgba(6, 14, 24, 0.62); }
      #fx { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .panel { position: absolute; background: var(--glass); border: 1px solid rgba(46, 242, 255, 0.35);
        border-radius: 14px; backdrop-filter: blur(6px); box-shadow: 0 0 24px rgba(46, 242, 255, 0.15); }
      #title { left: 40px; top: 40px; padding: 10px 22px; font-size: 30px; font-weight: 700; letter-spacing: 1px; max-width: 760px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #title .A { color: var(--a); } #title .B { color: var(--b); } #title i { font-style: normal; opacity: .6; margin: 0 10px; font-size: 22px; }
      #clock { right: 40px; top: 40px; padding: 10px 22px; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #cards { position: absolute; left: 40px; right: 40px; top: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card { position: relative; padding: 14px 18px; }
      .card .hd { display: flex; justify-content: space-between; align-items: baseline; }
      .card .nm { font-size: 30px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; letter-spacing: 2px; }
            .bar { height: 10px; margin: 8px 0 6px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 5px; }
      .stats { display: flex; justify-content: space-between; font-size: 22px; font-variant-numeric: tabular-nums; }
      .stats span { opacity: 0.6; font-size: 16px; letter-spacing: 1px; margin-left: 4px; }
      .A { border-color: rgba(59,139,255,.6); box-shadow: 0 0 24px rgba(59,139,255,.18); } .A .nm { color: var(--a); } .A .bar i { background: linear-gradient(90deg, #1b4fb0, var(--a)); }
      .B { border-color: rgba(255,59,78,.6); box-shadow: 0 0 24px rgba(255,59,78,.18); } .B .nm { color: var(--b); } .B .bar i { background: linear-gradient(90deg, #9e1626, var(--b)); }
      #speed { left: 40px; bottom: 60px; width: 420px; padding: 18px 24px; border-color: rgba(214,255,58,.5); box-shadow: 0 0 30px rgba(214,255,58,.18); }
      #speed .lbl { font-size: 20px; letter-spacing: 4px; opacity: 0.75; }
      #speed .val { font-size: 110px; font-weight: 700; line-height: 1; color: var(--s); font-variant-numeric: tabular-nums; }
      #speed .val small { font-size: 32px; margin-left: 8px; color: #e8fbff; opacity: 0.7; }
      #speed .peak { font-size: 22px; opacity: 0.8; font-variant-numeric: tabular-nums; }
      #map { right: 40px; bottom: 60px; width: 330px; height: 560px; padding: 0; }
      #map canvas { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
      <video id="a-roll" class="clip" src="rally.mp4" playsinline data-start="0" data-duration="__DUR__" data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" data-has-audio="true"></video>

      <div id="hud" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1">
        <canvas id="fx" width="1080" height="1920"></canvas>
        <div id="title" class="panel"></div>
        <div id="clock" class="panel">00:00.0</div>
        <div id="cards"></div>
        <div id="speed" class="panel">
          <div class="lbl">SHUTTLE SPEED</div>
          <div class="val"><span id="kmh">0</span><small>km/h</small></div>
          <div class="peak">PEAK <span id="peak">0</span> km/h</div>
        </div>
        <div id="map" class="panel"><canvas id="mapc" width="330" height="560"></canvas></div>
      </div>
    </div>

    <script>
      const T = window.TRACKS, FPS = T.fps, N = T.n, S = 1080 / T.w; // source px -> canvas px
      const OY = (1920 - T.h * S) / 2;
      const { W, L, NET } = T.court, H = T.H;
      const V = window.__hyperframes.getVariables(), NAMES = [V.p1, V.p2, V.p3, V.p4], TEAM = ["A", "A", "B", "B"];
      const COL = { A: "#3b8bff", B: "#ff3b4e" };
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
      document.getElementById("title").innerHTML = `<span class="A">${esc(NAMES[0])}, ${esc(NAMES[1])}</span><i>vs</i><span class="B">${esc(NAMES[2])}, ${esc(NAMES[3])}</span>`;

      // world (m) -> source image px via inverse homography
      const inv = (m) => {
        const [a, b, c] = m[0], [d, e, f] = m[1], [g, h, i] = m[2];
        const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g, det = a * A + b * B + c * C;
        return [[A, -(b * i - c * h), b * f - c * e], [B, a * i - c * g, -(a * f - c * d)], [C, -(a * h - b * g), a * e - b * d]].map((r) => r.map((v) => v / det));
      };
      const Hi = inv(H);
      const proj = (m, x, y) => { const z = m[2][0] * x + m[2][1] * y + m[2][2]; return [(m[0][0] * x + m[0][1] * y + m[0][2]) / z, (m[1][0] * x + m[1][1] * y + m[1][2]) / z]; };
      const toCanvas = ([x, y]) => [x * S, y * S + OY];

      // --- precompute smoothed per-player series (fill gaps by interpolation, then moving average)
      const fill = (arr) => {
        const idx = arr.map((v, i) => (v ? i : -1)).filter((i) => i >= 0);
        if (!idx.length) return arr;
        return arr.map((v, i) => {
          if (v) return v;
          const nx = idx.find((k) => k > i), pv = [...idx].reverse().find((k) => k < i);
          if (pv === undefined) return arr[nx]; if (nx === undefined) return arr[pv];
          const t = (i - pv) / (nx - pv), lerp = (p, q) => p.map((x, j) => x + (q[j] - x) * t);
          return { w: lerp(arr[pv].w, arr[nx].w), box: lerp(arr[pv].box, arr[nx].box), ghost: true };
        });
      };
      const smooth = (arr, key, r = 4) => arr.map((_, i) => {
        let s = null, n = 0;
        for (let k = Math.max(0, i - r); k <= Math.min(arr.length - 1, i + r); k++) {
          const v = arr[k] && arr[k][key]; if (!v) continue;
          s = s ? s.map((x, j) => x + v[j]) : [...v]; n++;
        }
        return s && s.map((x) => x / n);
      });
      const P = [0, 1, 2, 3].map((p) => {
        const raw = fill(T.players.map((f) => f[p]));
        const w = smooth(raw, "w"), box = smooth(raw, "box", 2);
        const dist = [0], spd = [0];
        for (let i = 1; i < N; i++) {
          const d = w[i] && w[i - 1] ? Math.hypot(w[i][0] - w[i - 1][0], w[i][1] - w[i - 1][1]) : 0;
          dist.push(dist[i - 1] + d); spd.push(d * FPS * 3.6);
        }
        const spdS = spd.map((_, i) => { let s = 0, n = 0; for (let k = Math.max(0, i - 8); k <= i; k++) { s += spd[k]; n++; } return s / n; });
        return { w, box, dist, spd: spdS };
      });

      // shuttle speed: image px/frame scaled by metres/px of nearest player (assume 1.75 m tall)
      // ponytail: 2D estimate, ignores motion toward camera; upgrade = 3D trajectory fit with 2 views or physics model.
      const sh = T.shuttle;
      const shK = sh.map((p, i) => {
        if (!p) return null;
        let j = i - 1; while (j >= 0 && j >= i - 3 && !sh[j]) j--;
        if (j < 0 || j < i - 3 || !sh[j]) return null;
        const px = Math.hypot(p[0] - sh[j][0], p[1] - sh[j][1]) / (i - j);
        let best = null, bd = 1e9;
        P.forEach((pl) => { const b = pl.box[i]; if (!b) return; const d = Math.hypot((b[0] + b[2]) / 2 - p[0], (b[1] + b[3]) / 2 - p[1]); if (d < bd) { bd = d; best = b; } });
        const mpp = best ? 1.75 / Math.max(20, best[3] - best[1]) : 0.03;
        return Math.min(320, px * mpp * FPS * 3.6);
      });
      const shDisp = shK.map((_, i) => { // hold last value briefly, decay when lost
        for (let k = i; k >= Math.max(0, i - 10); k--) if (shK[k] != null) return shK[k] * (1 - (i - k) * 0.06);
        return 0;
      });
      const peakAt = shDisp.reduce((a, v, i) => (a.push(Math.max(a[i - 1] || 0, v)), a), []);

      // --- build cards
      const cards = document.getElementById("cards");
      cards.innerHTML = [0, 1, 2, 3].map((p) => `
        <div class="card panel ${TEAM[p]}"><div class="hd"><div class="nm">${esc(NAMES[p])}</div></div>
        <div class="bar"><i id="st${p}"></i></div>
        <div class="stats"><div><b id="sp${p}">0.0</b><span>KM/H</span></div><div><b id="ds${p}">0.0</b><span>M RUN</span></div></div></div>`).join("");
      const $ = (id) => document.getElementById(id);
      const fx = $("fx").getContext("2d"), mc = $("mapc").getContext("2d");

      function ring(ctx, wx, wy, r, color, t) {
        ctx.beginPath();
        for (let k = 0; k <= 48; k++) {
          const a = (k / 48) * Math.PI * 2, [x, y] = toCanvas(proj(Hi, wx + Math.cos(a) * r, wy + Math.sin(a) * r));
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = color + "33"; ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 18; ctx.stroke();
        // rotating tick arc
        ctx.beginPath();
        for (let k = 0; k <= 12; k++) {
          const a = t * 3 + (k / 12) * 1.6, [x, y] = toCanvas(proj(Hi, wx + Math.cos(a) * r * 1.25, wy + Math.sin(a) * r * 1.25));
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
      }

      function drawMap(f) {
        const c = mc, cw = 330, ch = 560, pad = 30, sx = (cw - 2 * pad) / W, sy = (ch - 2 * pad) / L;
        const m = (x, y) => [pad + x * sx, pad + (L - y) * sy]; // far side at top, left/right as camera sees it
        c.clearRect(0, 0, cw, ch);
        c.fillStyle = "rgba(10,80,60,0.55)"; c.fillRect(pad, pad, cw - 2 * pad, ch - 2 * pad);
        c.strokeStyle = "rgba(255,255,255,0.7)"; c.lineWidth = 1.5;
        const line = (a, b, cc, d) => { c.beginPath(); c.moveTo(...m(a, b)); c.lineTo(...m(cc, d)); c.stroke(); };
        c.strokeRect(pad, pad, cw - 2 * pad, ch - 2 * pad);
        line(0.46, 0, 0.46, L); line(W - 0.46, 0, W - 0.46, L);
        [NET - 1.98, NET + 1.98, 0.76, L - 0.76].forEach((y) => line(0, y, W, y));
        line(W / 2, 0, W / 2, NET - 1.98); line(W / 2, NET + 1.98, W / 2, L);
        c.strokeStyle = "#fff"; c.lineWidth = 3; line(-0.2, NET, W + 0.2, NET);
        P.forEach((pl, p) => {
          const col = COL[TEAM[p]];
          c.beginPath(); // trail
          for (let k = Math.max(0, f - 45); k <= f; k++) { const w = pl.w[k]; if (!w) continue; const [x, y] = m(...w); c.lineTo(x, y); }
          c.strokeStyle = col + "88"; c.lineWidth = 2; c.stroke();
          const w = pl.w[f]; if (!w) return;
          const [x, y] = m(...w);
          c.beginPath(); c.arc(x, y, 9, 0, 7); c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 12; c.fill(); c.shadowBlur = 0;
          c.fillStyle = "#001"; c.font = "bold 11px Rajdhani"; c.textAlign = "center"; c.fillText(p + 1, x, y + 4);
        });
      }

      function draw(t) {
        const f = Math.max(0, Math.min(N - 1, Math.round(t * FPS)));
        fx.clearRect(0, 0, 1080, 1920);
        P.forEach((pl, p) => {
          const w = pl.w[f], b = pl.box[f]; if (!w || !b) return;
          const col = COL[TEAM[p]], r = p < 2 ? 0.45 : 0.5;
          ring(fx, w[0], w[1], r, col, t);
          const [hx, hy] = toCanvas([(b[0] + b[2]) / 2, b[1]]); // head tag
          fx.font = `bold ${p < 2 ? 30 : 22}px Rajdhani`; fx.textAlign = "center";
          fx.fillStyle = col; fx.shadowColor = col; fx.shadowBlur = 10;
          fx.fillText(`▼ ${NAMES[p]}`, hx, hy - 10); fx.shadowBlur = 0;
          $(`sp${p}`).textContent = pl.spd[f].toFixed(1);
          $(`ds${p}`).textContent = pl.dist[f].toFixed(1);
          $(`st${p}`).style.width = `${Math.max(8, 100 - pl.dist[f] * 2.2)}%`; // ponytail: stamina = toy curve from distance run
        });
        // shuttle trail
        const pts = [];
        for (let k = Math.max(0, f - 10); k <= f; k++) if (sh[k]) pts.push([k, toCanvas(sh[k])]);
        pts.forEach(([k, [x, y]], i) => {
          const a = (i + 1) / pts.length;
          fx.beginPath(); fx.arc(x, y, 4 + 8 * a, 0, 7);
          fx.fillStyle = `rgba(214,255,58,${0.15 + 0.6 * a})`; fx.shadowColor = "#d6ff3a"; fx.shadowBlur = 20; fx.fill();
        });
        if (sh[f]) {
          const [x, y] = toCanvas(sh[f]);
          fx.lineWidth = 3; fx.strokeStyle = "#d6ff3a"; fx.beginPath(); fx.arc(x, y, 22, 0, 7); fx.stroke();
          fx.font = "bold 26px Rajdhani"; fx.fillStyle = "#d6ff3a"; fx.textAlign = "left";
          fx.fillText(`${Math.round(shDisp[f])} km/h`, x + 28, y - 10);
        }
        fx.shadowBlur = 0;
        $("kmh").textContent = Math.round(shDisp[f]);
        $("peak").textContent = Math.round(peakAt[f]);
        $("clock").textContent = `00:${String(Math.floor(t)).padStart(2, "0")}.${Math.floor((t % 1) * 10)}`;
        drawMap(f);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: __DUR__, duration: __DUR__, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      tl.from("#cards .card", { y: -40, opacity: 0, duration: 0.5, stagger: 0.08 }, 0);
      tl.from(["#speed", "#map", "#title", "#clock"], { opacity: 0, y: 30, duration: 0.5, stagger: 0.06 }, 0.1);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
